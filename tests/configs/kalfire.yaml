esphome:
  name: kalfire-test

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:

external_components:
  source:
    type: local
    path: ../../components
  components: [kalfire]

i2c:
  sda: GPIO2
  scl: GPIO1

gp8403:
  id: dac_gp8403
  model: GP8413
  voltage: 10V
  address: 0x59

output:
  - platform: gp8403
    id: fireplace_output
    gp8403_id: dac_gp8403
    channel: 0

switch:
  - platform: kalfire
    flame:
      id: flame_request
      name: Enable flame
    eco_mode:
      id: eco_request
      name: Enable ECO mode

number:
  - platform: kalfire
    flame_height:
      id: requested_height
      name: Flame height

kalfire:
  id: fireplace
  output: fireplace_output
