esphome:
  name: 'kalfire-example'

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:

# Keep the local session timer running through an HA/API outage.
api:
  reboot_timeout: 0s

web_server:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components
    components: [kalfire]

# or use the following to get the latest version from github
# For deployment, pin to a tested commit or tag rather than a moving branch.
# external_components:
#   source: github://sillevl/esphome-components@<tested-commit>
#   components: [ kalfire ]

i2c:
  sda: GPIO2
  scl: GPIO1
  scan: true
  id: i2c_bus

gp8403:
  id: dac_gp8403
  model: GP8413
  voltage: 10V
  address: 0x59

output:
  - platform: gp8403
    id: my_gp8403_output_1
    gp8403_id: dac_gp8403
    channel: 0
  - platform: gp8403
    id: my_gp8403_output_2
    gp8403_id: dac_gp8403
    channel: 1

select:
  - platform: kalfire
    id: fireplace_mode
    name: Fireplace mode

number:
  - platform: kalfire
    flame_height:
      name: Flame height

kalfire:
  id: my_kalfire
  output: my_gp8403_output_1

  # Optional fixed local timer. Use this OR session_duration, not both.
  # Omit both for manual-only operation.
  # session_timeout: 90min

  # Optional duration dropdown, default 1h; remembers the last chosen duration.
  # Options: 15min, 30min, 45min, 1h, 1h30, 2h, 3h, 4h.
  # Changes apply only to the next session, never to an active countdown.
  # session_duration:
  #   name: Session duration

  # Optional temporary maximum-output override, then back to the prior mode.
  # Normal flame height remains selected; Boost active indicates the override.
  # Existing session and temperature limits always take priority.
  # boost:
  #   name: Boost 10min
  #   duration: 10min
  #   active:
  #     name: Boost active
  #   time_remaining:
  #     name: Boost time remaining

  # Optional ceiling: room_temperature must be a real, periodically publishing
  # Celsius sensor defined elsewhere in this configuration. Read the module's
  # freshness documentation before using a sensor imported from HA.
  # temperature_limit:
  #   sensor: room_temperature
  #   ceiling: 23°C
  #   restart_margin: 0.5°C
  #   max_age: 5min
  #   unavailable_grace_period: 60s

  # Optional diagnostics (no temperature sensor is required to enable these).
  # time_remaining:
  #   name: Session time remaining
  # last_stop_reason:
  #   name: Last stop reason
  # temperature_limit_status:
  #   name: Temperature limit status

