name: Kalfire tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Native component regression tests
        run: python tests/run_cpp_tests.py
      - name: ESPHome schema and code-generation tests
        run: python -m pytest tests/test_config.py -q
      - name: ESP32-S3 builds, optional limits and duration dropdown (no upload)
        run: |
          python -m esphome compile tests/configs/kalfire.yaml
          python -m esphome compile tests/configs/kalfire-limits.yaml
          python -m esphome compile tests/configs/kalfire-duration.yaml
